name: Phase4 dependency lock refresh

on:
  push:
    branches:
      - phase4/qa-uat-security-20260924
    paths:
      - .github/workflows/phase4-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: phase4/qa-uat-security-20260924

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, bcmath, curl, fileinfo, pdo_sqlite, pdo_pgsql, redis
          coverage: none

      - name: Refresh vulnerable package lock
        run: composer update league/commonmark --with-dependencies --minimal-changes --no-interaction --no-progress --no-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock already safe"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "fix(security): refresh commonmark lockfile - vaftec"
          git push origin HEAD:phase4/qa-uat-security-20260924
