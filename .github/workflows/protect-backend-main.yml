name: Protect Backend main (administrator approval)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-protection-policy:
    name: Validate main protection policy (no admin access)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow contains fail-closed controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/protect-backend-main.yml').read_text()
          required=['refs/heads/main', 'HIPOCRATIQ-Backend-Protect-Main', 'non_fast_forward', 'deletion', 'pull_request', 'required_status_checks', 'hipocratiq-security-admin', 'BACKEND_RULESET_ADMIN_TOKEN', 'Release evidence / main P0 NO-GO (read-only)']
          missing=[x for x in required if x not in p]
          if missing: raise SystemExit('Missing required main-protection guards: '+', '.join(missing))
          print('PASS: policy invariants found; no GitHub administration or AWS changes performed')
          PY
  protect-main:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: hipocratiq-security-admin
    timeout-minutes: 5
    steps:
      - name: Create and verify main ruleset using restricted admin token
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.BACKEND_RULESET_ADMIN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          if repo!='VaftecPeru/Hipocratiq_backend':
              raise SystemExit('Unexpected repository')
          token=os.environ.get('ADMIN_TOKEN','')
          if not token:
              raise SystemExit('Missing BACKEND_RULESET_ADMIN_TOKEN; no changes made')
          root='https://api.github.com/repos/'+repo
          def request(method,path,data=None):
              body=json.dumps(data).encode() if data is not None else None
              r=urllib.request.Request(root+path,data=body,method=method,headers={
                 'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                 'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json',
                 'User-Agent':'HIPOCRATIQ-main-protection'})
              with urllib.request.urlopen(r,timeout=20) as res:return json.load(res)
          existing=request('GET','/rulesets')
          if any(x.get('name')=='HIPOCRATIQ-Backend-Protect-Main' for x in existing):
              print('Main ruleset already exists; refusing duplicate or silent mutation')
              raise SystemExit(1)
          dev=request('GET','/rulesets/25978302')
          if dev.get('enforcement')!='active' or dev.get('conditions',{}).get('ref_name',{}).get('include')!=['refs/heads/develop']:
              raise SystemExit('Unexpected source develop ruleset')
          ruletypes={x.get('type') for x in dev.get('rules',[])}
          if not {'deletion','non_fast_forward','pull_request','required_status_checks'}<=ruletypes:
              raise SystemExit('Develop ruleset lacks safety controls')
          checks=[{'context':'lint','integration_id':15368},
                  {'context':'Actual Next.js to Laravel with PostgreSQL17 Redis8 (no PHI)','integration_id':15368},
                  {'context':'Release evidence / main P0 NO-GO (read-only)','integration_id':15368}]
          rules=[{'type':'deletion'},{'type':'non_fast_forward'},
                 {'type':'pull_request','parameters':{
                    'required_approving_review_count':0,
                    'dismiss_stale_reviews_on_push':True,
                    'required_review_thread_resolution':True,
                    'require_code_owner_review':False,
                    'require_last_push_approval':False,
                    'allowed_merge_methods':['merge','squash','rebase']}},
                 {'type':'required_status_checks','parameters':{
                    'strict_required_status_checks_policy':True,
                    'do_not_enforce_on_create':False,
                    'required_status_checks':checks}}]
          payload={'name':'HIPOCRATIQ-Backend-Protect-Main',
                   'target':'branch','enforcement':'active',
                   'conditions':{'ref_name':{'include':['refs/heads/main'],'exclude':[]}},
                   'rules':rules,'bypass_actors':[]}
          created=request('POST','/rulesets',payload)
          rid=created.get('id')
          if not isinstance(rid,int):raise SystemExit('No ruleset id; verify manually')
          verified=request('GET','/rulesets/'+str(rid))
          branch=request('GET','/branches/main')
          if not (verified.get('enforcement')=='active'
                  and verified.get('conditions',{}).get('ref_name',{}).get('include')==['refs/heads/main']
                  and branch.get('protected') is True):
              raise SystemExit('Ruleset verification failed; inspect GitHub rules')
          print('Backend main protection active and independently verified; ruleset ID',rid)
          PY
