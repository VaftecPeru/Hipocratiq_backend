name: Phase 4 Composer Lock Refresh

on:
  push:
    branches:
      - phase4/qa-uat-security-20260925
    paths:
      - .github/workflows/phase4-composer-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: phase4/qa-uat-security-20260925

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, bcmath, curl, fileinfo, pdo_sqlite, pdo_pgsql, redis
          coverage: none

      - name: Refresh secure CommonMark lock
        run: composer update league/commonmark --with-all-dependencies --no-interaction --no-progress --no-scripts

      - name: Verify Composer audit
        run: composer audit --locked --no-interaction

      - name: Commit refreshed composer lock
        run: |
          if git diff --quiet -- composer.lock; then
            echo "Composer lock already secure."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore(backend): refresh secure composer lock"
          git push origin HEAD:phase4/qa-uat-security-20260925
