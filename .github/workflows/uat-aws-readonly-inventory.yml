name: UAT AWS Inventory (read-only, opt-in)

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/uat-aws-readonly-inventory.yml
      - scripts/uat_aws_inventory_readonly.py
      - tests/Scripts/test_uat_aws_inventory_readonly.py
      - tests/Scripts/test_uat_oidc_readonly_role.py
      - scripts/uat_github_protected_develop_preflight.py
      - tests/Scripts/test_uat_github_protected_develop_preflight.py
      - tests/Scripts/test_uat_aws_inventory_workflow_activation.py
      - infra/aws/uat-readonly-oidc-role.json
  # workflow_dispatch is unavailable while this workflow is absent from the
  # default main branch. Future reviewed develop pushes can trigger inventory,
  # but ONLY after both opt-in vars, branch SHA and environment reviewers pass.
  # This path-unfiltered trigger never assumes AWS credentials by default.
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: Type READ_ONLY_UAT_INVENTORY
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: hipocratiq-uat-aws-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-safety:
    name: Safety guards (mock AWS only, no credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python syntax
        run: python3 -m py_compile scripts/uat_aws_inventory_readonly.py tests/Scripts/test_uat_aws_inventory_readonly.py tests/Scripts/test_uat_oidc_readonly_role.py scripts/uat_github_protected_develop_preflight.py tests/Scripts/test_uat_github_protected_develop_preflight.py tests/Scripts/test_uat_aws_inventory_workflow_activation.py
      - name: Simulate IAM, EC2, VPC, EBS and security group scenarios
        run: |
          python3 -m unittest discover -s tests/Scripts -p 'test_uat_aws_inventory_readonly.py' -v
          python3 -m unittest discover -s tests/Scripts -p 'test_uat_oidc_readonly_role.py' -v
          python3 -m unittest discover -s tests/Scripts -p 'test_uat_github_protected_develop_preflight.py' -v
          python3 -m unittest discover -s tests/Scripts -p 'test_uat_aws_inventory_workflow_activation.py' -v
      - name: Scope
        run: |
          echo "Offline IAM trust and policy guards passed; no AWS credentials requested or AWS API called."
          echo "Real UAT inventory is OFF by default and isolated from PRs."

  aws-uat-inventory:
    name: Approved AWS UAT instance metadata ONLY
    if: >-
      github.ref == 'refs/heads/develop' &&
      vars.HIPOCRATIQ_AWS_UAT_INVENTORY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      vars.HIPOCRATIQ_AWS_UAT_RUN_ON_DEVELOP_PUSH == 'true'))
    needs: offline-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: hipocratiq-uat-readonly
    permissions:
      contents: read
      id-token: write
    env:
      UAT_INVENTORY_ENABLED: ${{ vars.HIPOCRATIQ_AWS_UAT_INVENTORY_ENABLED }}
      UAT_PUSH_APPROVED: ${{ vars.HIPOCRATIQ_AWS_UAT_RUN_ON_DEVELOP_PUSH }}
      UAT_ACKNOWLEDGEMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.acknowledgement || vars.HIPOCRATIQ_AWS_UAT_PUSH_ACKNOWLEDGEMENT }}
      UAT_AWS_ACCOUNT_ID: ${{ vars.HIPOCRATIQ_UAT_AWS_ACCOUNT_ID }}
      UAT_AWS_REGION: ${{ vars.HIPOCRATIQ_UAT_AWS_REGION }}
      UAT_INSTANCE_ID: ${{ vars.HIPOCRATIQ_UAT_INSTANCE_ID }}
      PROD_INSTANCE_ID: ${{ vars.HIPOCRATIQ_PROD_INSTANCE_ID }}
      UAT_VPC_ID: ${{ vars.HIPOCRATIQ_UAT_VPC_ID }}
      PROD_VPC_ID: ${{ vars.HIPOCRATIQ_PROD_VPC_ID }}
      UAT_READONLY_ROLE_ARN: ${{ vars.HIPOCRATIQ_UAT_READONLY_ROLE_ARN }}
      MANUAL_ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}

    steps:
      - name: Checkout Backend develop only
        uses: actions/checkout@v4

      - name: Enforce fail-closed target, account, role and approval BEFORE AWS
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" &&
                "$MANUAL_ACKNOWLEDGEMENT" != "READ_ONLY_UAT_INVENTORY" ]]; then
            echo "::error::Read-only acknowledgement is required"
            exit 1
          fi
          python3 scripts/uat_aws_inventory_readonly.py --preflight

      - name: Verify protected develop and immutable workflow SHA before OIDC
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/uat_github_protected_develop_preflight.py

      - name: Assume UAT read-only AWS role using short-lived OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.HIPOCRATIQ_UAT_READONLY_ROLE_ARN }}
          role-session-name: hipocratiqUatInventory
          aws-region: ${{ vars.HIPOCRATIQ_UAT_AWS_REGION }}
          allowed-account-ids: ${{ vars.HIPOCRATIQ_UAT_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Inspect ONLY approved UAT EC2, network and EBS metadata
        shell: bash
        env:
          UAT_REPORT_PATH: ${{ runner.temp }}/hipocratiq-uat-aws-readonly.json
        run: |
          set -Eeuo pipefail
          command -v aws >/dev/null || { echo "::error::AWS CLI unavailable"; exit 1; }
          python3 scripts/uat_aws_inventory_readonly.py

      - name: Save redacted UAT inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hipocratiq-uat-aws-readonly-metadata
          path: ${{ runner.temp }}/hipocratiq-uat-aws-readonly.json
          if-no-files-found: ignore
          retention-days: 7
