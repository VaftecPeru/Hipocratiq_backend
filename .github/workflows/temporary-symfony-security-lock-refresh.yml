name: Temporary isolated Symfony lockfile security refresh (NO AWS)

on:
  push:
    branches:
      - fix/p0-116-127-dependency-regression-20261104
    paths:
      - .github/workflows/temporary-symfony-security-lock-refresh.yml

permissions:
  contents: write

concurrency:
  group: isolated-hipocratiq-symfony-lock-refresh
  cancel-in-progress: false

jobs:
  update-lock:
    name: Refresh Symfony security lock in isolated PR branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, bcmath, curl, fileinfo, pdo_sqlite, pdo_pgsql, redis, gd, zip
          tools: composer:v2
          coverage: none
      - name: Resolve Symfony patched packages (no installs, scripts or plugins)
        shell: bash
        run: |
          set -Eeuo pipefail
          composer update 'symfony/*' --with-all-dependencies --no-install --no-scripts --no-plugins --no-interaction --no-progress
          composer validate --no-interaction --no-check-publish
          composer audit --locked --no-interaction
      - name: Require affected Symfony packages to be patched
        shell: bash
        run: |
          set -Eeuo pipefail
          php <<'PHP'
          <?php
          $lock = json_decode(file_get_contents('composer.lock'), true, 512, JSON_THROW_ON_ERROR);
          $packages = array_merge($lock['packages'] ?? [], $lock['packages-dev'] ?? []);
          $wanted = ['symfony/filesystem', 'symfony/http-foundation', 'symfony/http-kernel', 'symfony/routing', 'symfony/yaml'];
          $found = [];
          foreach ($packages as $package) {
              if (in_array($package['name'], $wanted, true)) {
                  $version = ltrim($package['version'], 'v');
                  if (version_compare($version, '8.1.11', '<')) {
                      fwrite(STDERR, 'PATCHED_SYMFONY_REQUIRED\n');
                      exit(1);
                  }
                  $found[$package['name']] = true;
              }
          }
          if (count($found) !== count($wanted)) {
              fwrite(STDERR, 'MISSING_EXPECTED_SYMFONY_PACKAGE\n');
              exit(1);
          }
          echo 'SYMFONY_PATCHED=5/5; COMPOSER_AUDIT=PASS; NO_AWS_CALLS' . PHP_EOL;
          PHP
          git diff --quiet -- composer.json
      - name: Commit verified lockfile to dedicated PR branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- composer.lock
          if git diff --cached --quiet; then
            echo 'LOCKFILE_UNCHANGED_NO_COMMIT'
            exit 1
          fi
          git commit -m 'fix(deps): patch vulnerable Symfony lockfile packages (#116 #127)'
          git push origin HEAD:refs/heads/fix/p0-116-127-dependency-regression-20261104
