name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, xml, bcmath, curl, fileinfo, pdo_sqlite, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Create environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Laravel application
        run: php artisan key:generate --ansi

      - name: Validate Composer metadata
        run: composer validate --no-interaction

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: composer test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Validate routes
        run: php artisan route:list --except-vendor

  release-validation:
    name: Backend release validation
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: back_api
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, xml, bcmath, curl, fileinfo, pdo_sqlite, pdo_pgsql, redis
          coverage: none

      - name: Create environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Laravel application
        run: php artisan key:generate --ansi

      - name: Validate PostgreSQL migrations
        run: php artisan migrate --force --no-interaction
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: back_api
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_URL: ''

      - name: Run registration plans performance smoke
        shell: bash
        run: |
          touch database/performance.sqlite
          export APP_ENV=testing
          export DB_CONNECTION=sqlite
          export DB_DATABASE="$GITHUB_WORKSPACE/database/performance.sqlite"
          export CACHE_STORE=array
          export SESSION_DRIVER=array
          export QUEUE_CONNECTION=sync
          php artisan migrate --force --no-interaction
          php artisan db:seed --force --no-interaction
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/hipocratiq-performance.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health/live > /dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat /tmp/hipocratiq-performance.log
              exit 1
            fi
            sleep 1
          done
          bash scripts/performance-smoke.sh

      - name: Validate Docker Compose runtime
        run: docker compose config --quiet

      - name: Build backend Docker image
        run: docker build --tag hipocratiq-backend:ci .

      - name: Validate PostgreSQL backup tooling in image
        run: |
          docker run --rm hipocratiq-backend:ci pg_dump --version
          docker run --rm hipocratiq-backend:ci pg_restore --version
