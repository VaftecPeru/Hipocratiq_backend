name: B-099 Generate AWS SDK Lock

on:
  push:
    branches:
      - feature/b099-aws-notify-otp

permissions:
  contents: read

jobs:
  generate-lock-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, xml, simplexml, bcmath, curl, fileinfo, pdo_sqlite, redis
          coverage: none

      - name: Resolve AWS SDK dependency
        run: composer update aws/aws-sdk-php --with-all-dependencies --no-interaction --no-progress

      - name: Validate Composer files
        run: composer validate --strict

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run OTP integration tests
        run: |
          php artisan test --compact tests/Feature/Auth/AwsNotifyOtpFlowTest.php
          php artisan test --compact tests/Feature/Auth/OtpAuthenticationTest.php
          php artisan test --compact tests/Feature/Auth/LoginTest.php

      - name: Upload resolved Composer lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b099-composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 1
