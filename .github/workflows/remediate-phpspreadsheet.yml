name: Remediate PhpSpreadsheet security (PR only)
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, zip, gd, redis
          coverage: none
          tools: composer:v2
      - name: Refresh only PhpSpreadsheet dependency tree
        run: composer update phpoffice/phpspreadsheet --with-all-dependencies --no-interaction --no-progress --no-scripts
      - name: Require real audit remediation
        run: composer audit --locked --no-interaction
      - name: Verify updated lock and dependency resolution
        shell: bash
        run: |
          composer validate --strict --no-interaction
          composer install --dry-run --no-interaction
          git diff --exit-code -- composer.json
          test -n "$(git diff -- composer.lock)"
      - name: Create remediation PR; never merge automatically
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: security/fix-phpspreadsheet-lock
          base: develop
          add-paths: composer.lock
          commit-message: 'security: update PhpSpreadsheet resolved dependencies'
          title: 'security: remediate PhpSpreadsheet advisories (composer.lock)'
          body: 'Generated by dependency remediation workflow. Requires CI, Excel import/export regression tests and review. No automatic merge or deploy.'
