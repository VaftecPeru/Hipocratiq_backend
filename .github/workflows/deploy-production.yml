name: Deploy Backend Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe DEPLOY para confirmar producción"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hipocratiq-production-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    runs-on: [self-hosted, linux, x64, hipocratiq-vps]
    timeout-minutes: 30
    steps:
      - name: Check out release scripts
        uses: actions/checkout@v5

      - name: Deploy backend with backup and rollback guard
        env:
          PRODUCTION_DIR: /srv/hipocratiq/backend
          COMPOSE_PROJECT: hipocratiq-backend
          HEALTH_URL: https://hipocratiq.com/backend/api/health/ready
        run: bash scripts/deploy-production.sh
