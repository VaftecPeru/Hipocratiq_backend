name: P0-102 trigger full Backend CI for patched Laravel
on:
  push:
    branches:
      - security/p0-102-full-history-gitleaks-20261113
    paths:
      - .github/workflows/p0-102-dispatch-ci-one-shot.yml
permissions:
  contents: write
  actions: write
jobs:
  trigger-ci:
    if: github.repository == 'VaftecPeru/Hipocratiq_backend' && github.ref == 'refs/heads/security/p0-102-full-history-gitleaks-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/p0-102-full-history-gitleaks-20261113
          persist-credentials: true
      - name: Remove one-time dispatcher, then dispatch existing complete CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "security/p0-102-full-history-gitleaks-20261113"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/p0-102-dispatch-ci-one-shot.yml
          git commit -m "chore(ci): remove one-time security CI dispatcher"
          git push origin HEAD:refs/heads/security/p0-102-full-history-gitleaks-20261113
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref security/p0-102-full-history-gitleaks-20261113
          echo 'FULL_CI_DISPATCH_REQUESTED_FOR_CURRENT_SECURITY_BRANCH'
