# One-shot job: generate a genuine Composer lock on the isolated security branch.
# This workflow deletes its own YAML after a successful, audited update.
name: P0-102 one-shot Laravel security patch
on:
  push:
    branches:
      - security/p0-102-full-history-gitleaks-20261113
    paths:
      - .github/workflows/p0-102-laravel-advisory-one-shot.yml
permissions:
  contents: write
jobs:
  update-laravel:
    name: Resolve Laravel advisory with Composer, audit, commit ONLY to security branch
    if: github.repository == 'VaftecPeru/Hipocratiq_backend' && github.ref == 'refs/heads/security/p0-102-full-history-gitleaks-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact security branch
        uses: actions/checkout@v4
        with:
          ref: security/p0-102-full-history-gitleaks-20261113
          persist-credentials: true
          fetch-depth: 1
      - name: Set up PHP 8.4 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: redis, gd, zip, mbstring, dom, xml, xmlreader, xmlwriter, simplexml
          tools: composer:v2
      - name: Resolve minimal Laravel dependency update and enforce audit
        shell: bash
        env:
          COMPOSER_NO_INTERACTION: '1'
          COMPOSER_PROCESS_TIMEOUT: '0'
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "security/p0-102-full-history-gitleaks-20261113"
          composer require 'laravel/framework:^13.40.0' --no-update --no-interaction --no-scripts --no-plugins
          composer update laravel/framework --with-all-dependencies --no-install --no-scripts --no-plugins --no-progress --no-interaction
          composer validate --strict --no-check-publish --no-interaction
          composer audit --locked --no-interaction
          php -r '$l=json_decode(file_get_contents("composer.lock"),true); foreach($l["packages"] as $p){if($p["name"]==="laravel/framework"){if(version_compare(ltrim($p["version"],"v"),"13.40.0","<")){fwrite(STDERR,"Laravel patch too old\n");exit(1);}echo "LARAVEL_PATCH_VERSION=".$p["version"]."\n";exit(0);}}exit(1);'
          git diff --check
      - name: Commit audited manifest and lock; remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "security/p0-102-full-history-gitleaks-20261113"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- composer.json composer.lock
          git rm -- .github/workflows/p0-102-laravel-advisory-one-shot.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'NO_UPDATES'; exit 1; }
          git commit -m "fix(security): patch Laravel advisory and regenerate Composer lock"
          git push origin HEAD:refs/heads/security/p0-102-full-history-gitleaks-20261113
