name: AWS UAT configuration diagnostic (offline, no credentials)

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/uat-aws-configuration-diagnostic.yml
      - scripts/uat_aws_actions_config_preflight.py
      - tests/Scripts/test_uat_aws_actions_config_preflight.py
      - scripts/uat_github_admin_governance_readonly.py
      - tests/Scripts/test_uat_github_admin_governance_readonly.py
      - scripts/configure_github_release_governance.py
      - tests/Scripts/test_configure_github_release_governance.py
  # Always refresh NON-AWS configuration evidence when reviewed code lands on develop.
  # This workflow has no Environment, OIDC permission or AWS credentials.
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hipocratiq-aws-uat-config-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory-configuration:
    name: No AWS credentials / GitHub vars presence and format only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HIPOCRATIQ_AWS_UAT_INVENTORY_ENABLED: ${{ vars.HIPOCRATIQ_AWS_UAT_INVENTORY_ENABLED }}
      HIPOCRATIQ_AWS_UAT_RUN_ON_DEVELOP_PUSH: ${{ vars.HIPOCRATIQ_AWS_UAT_RUN_ON_DEVELOP_PUSH }}
      HIPOCRATIQ_UAT_AWS_ACCOUNT_ID: ${{ vars.HIPOCRATIQ_UAT_AWS_ACCOUNT_ID }}
      HIPOCRATIQ_UAT_AWS_REGION: ${{ vars.HIPOCRATIQ_UAT_AWS_REGION }}
      HIPOCRATIQ_UAT_INSTANCE_ID: ${{ vars.HIPOCRATIQ_UAT_INSTANCE_ID }}
      HIPOCRATIQ_PROD_INSTANCE_ID: ${{ vars.HIPOCRATIQ_PROD_INSTANCE_ID }}
      HIPOCRATIQ_UAT_VPC_ID: ${{ vars.HIPOCRATIQ_UAT_VPC_ID }}
      HIPOCRATIQ_PROD_VPC_ID: ${{ vars.HIPOCRATIQ_PROD_VPC_ID }}
      HIPOCRATIQ_UAT_READONLY_ROLE_ARN: ${{ vars.HIPOCRATIQ_UAT_READONLY_ROLE_ARN }}
      # Runner filesystem paths are available only after the job starts.
    steps:
      - name: Checkout only this repository (never infra)
        uses: actions/checkout@v4

      - name: Regression tests of fail-closed checks
        run: |
          python3 -m py_compile scripts/uat_aws_actions_config_preflight.py tests/Scripts/test_uat_aws_actions_config_preflight.py
          python3 -m unittest discover -s tests/Scripts -p 'test_uat_aws_actions_config_preflight.py' -v

      - name: Validate GitHub private-repo governance policy using mock responses only
        run: |
          python3 -m py_compile scripts/uat_github_admin_governance_readonly.py tests/Scripts/test_uat_github_admin_governance_readonly.py
          python3 -m unittest discover -s tests/Scripts -p 'test_uat_github_admin_governance_readonly.py' -v
          python3 scripts/uat_github_admin_governance_readonly.py

      - name: Exercise GitHub administration bootstrap OFFLINE (no token, no writes)
        run: |
          python3 -m py_compile scripts/configure_github_release_governance.py tests/Scripts/test_configure_github_release_governance.py
          python3 -m unittest discover -s tests/Scripts -p 'test_configure_github_release_governance.py' -v
          python3 scripts/configure_github_release_governance.py

      - name: Record sanitized configuration readiness (no network)
        env:
          UAT_READINESS_REPORT_PATH: ${{ runner.temp }}/hipocratiq-uat-actions-config-offline.json
        run: python3 scripts/uat_aws_actions_config_preflight.py

      - name: Upload redacted configuration artifact (NOT an AWS inventory)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hipocratiq-aws-uat-config-offline-only
          path: ${{ runner.temp }}/hipocratiq-uat-actions-config-offline.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Clarify unresolved AWS and release gates
        if: always()
        run: |
          echo "This workflow never assumes an AWS role or queries EC2/VPC/SSM."
          echo "Actual AWS UAT inventory requires manual dispatch of the existing approved workflow."
          echo "The protected GitHub Environment reviewers/OIDC trust and production separation require independent confirmation."
          echo "No AWS connection, no SMS, no deployment. Clinical release is NO-GO."
